# LoRA SFT on Qwen/Qwen3.5-4B — the explicit alternative to the MiniCPM default.
#
# Identical to configs/training_lora.yaml except `model.name`: Qwen stays one
# flag/config away. Use it with
#   python3 scripts/train.py --config configs/training_lora_qwen.yaml
# or override any other config at the CLI:
#   python3 scripts/train.py --config configs/training_lora.yaml --model Qwen/Qwen3.5-4B
#
# Behaviour that differs from MiniCPM comes from lifemate.models.profiles:
# hybrid linear-attention projections are auto-discovered for Qwen, and the
# supervised terminator is Qwen's own <|im_end|> id.
training:
  method: sft
  tuning_mode: lora           # overrides the full default
  output_dir: outputs/checkpoints
  precision: bfloat16
  learning_rate: 2.0e-4       # ~40x the full-FT LR: only adapters train
  weight_decay: 0.01
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8  # effective batch stays 8 sequences
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  gradient_clip_norm: 1.0
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  save_steps: 0           # for save_strategy: steps; 0 = fall back to logging_steps
  eval_steps: 0           # for eval_strategy: steps; 0 = fall back to logging_steps
  seed: 42
  max_seq_length: 8192
  validation_ratio: 0.1
  optimizer: adamw_torch
  resume_from_checkpoint: null
  dataloader_num_workers: 0
  save_total_limit: 2
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null        # null => architecture-aware discovery (Qwen hybrid set)
  bias: none

model:
  name: Qwen/Qwen3.5-4B
  torch_dtype: bfloat16
  device: cuda
