# Closed-loop inference settings (model + agent budget).
model:
  name: openbmb/MiniCPM5-2B
  torch_dtype: bfloat16
  device: cuda
  attn_implementation: null
  trust_remote_code: false

inference:
  model_mode: base            # base | full | lora (see models/loader.resolve_model_mode)
  checkpoint: null
  split: public_test
  output: outputs/submission.jsonl
  batch_size: 1
  use_mock_env: false         # the official simulator is prohibited; mock only for tests
  limit: null

agent:
  max_steps: 8
  time_budget_seconds: 30.0  # Conservative submission target; official limit not independently verified.
  allow_ask_missing_info: true
  temperature: 0.0            # greedy: reproducible submissions
  max_new_tokens: 512
  stop_on_finish: true

asr:
  backend: gipformer
  model_id: g-group-ai-lab/gipformer-68M-rnnt
  revision: 318322b009200f8e77a3751fa64638e5cc85a7dc
  model_dir: null
  runtime: onnx
  device: cpu
  quantization: int8
  offline: true
  num_threads: 4
  # greedy_search is the fast/experimental option; modified_beam_search matches the published WER.
  decoding_method: modified_beam_search
  model_name: vinai/PhoWhisper-small
  language: vi
  sample_rate: 16000
  max_audio_seconds: 60
