# LoRA SFT: r=16, alpha=32, dropout=0.05. target_modules: null => auto-discovery
# adapts every attention/MLP projection the architecture actually has: the 7
# standard ones plus the hybrid linear-attention set (in_proj_qkv/z/a/b, out_proj),
# i.e. 12 suffixes over 248 Linear modules = 32,464,896 trainable params.
# Adapter state is a rounding error next to the base weights, so this fits a
# 24-40 GB GPU where full fine-tuning does not.
training:
  method: sft
  tuning_mode: lora           # overrides the full default
  output_dir: outputs/checkpoints
  precision: bfloat16
  learning_rate: 2.0e-4       # ~40x the full-FT LR: only adapters train
  weight_decay: 0.01
  num_train_epochs: 3
  per_device_train_batch_size: 1  # 8192 seq: microbatch 2 estimates 13.99 GB = 90.6% of
                                  # a 16 GB card's free VRAM ("tight"); 1 keeps 11.30 GB
  gradient_accumulation_steps: 8  # effective batch stays 8 sequences
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  gradient_clip_norm: 1.0
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  seed: 42
  max_seq_length: 8192            # 4096 truncated 75% of records and dropped the
                                  # "# Công cụ khả dụng" section from 176 of them
  validation_ratio: 0.1
  optimizer: adamw_torch
  resume_from_checkpoint: null
  dataloader_num_workers: 0
  save_total_limit: 2
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null        # null => architecture-aware discovery
  bias: none

model:
  name: Qwen/Qwen3.5-4B
  torch_dtype: bfloat16
  device: cuda
