[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate"
version = "0.1.0"
description = "Zalo AI Challenge 2026 Track 1 (LifeMate): voice-to-tool-calling agent reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LifeMate team" }]
# Stdlib only. Every heavy dependency is an extra and imported lazily.
dependencies = []

[project.scripts]
lifemate = "lifemate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
# Floors are the versions VERIFIED on the training box (torch 2.15.0+cu132,
# transformers 5.22.2, peft 0.21.2, accelerate 1.15.0). MiniCPM5-2B's config.json
# declares transformers_version 5.6.2 and Qwen3.5-4B needs the `qwen3_5` classes,
# neither of which exists at 4.44 — the old floor could not load either model.
train = [
    "torch>=2.15",
    "transformers>=5.22",
    "peft>=0.21",
    "accelerate>=0.33",
    "datasets>=2.20",
    "wandb>=0.17",
]
qlora = [
    "bitsandbytes>=0.43",
    "peft>=0.21",
    "torch>=2.15",
    "transformers>=5.22",
]
asr = [
    "numpy>=1.20",
    "soundfile>=0.12",
    "sherpa-onnx>=1.10",
    "sherpa-onnx-core>=1.10",
    "huggingface-hub>=0.20",
]
onnx = [
    "sherpa-onnx>=1.10",
    "sherpa-onnx-core>=1.10",
    "soundfile>=0.12",
    "numpy>=1.20",
]
asr-whisper = [
    "torch>=2.15",
    "transformers>=5.22",
    "soundfile>=0.12",
]
cloud = [
    "wandb>=0.17",
]
eda = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]
audio = ["soundfile>=0.12"]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
