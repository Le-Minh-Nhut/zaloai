[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate"
version = "0.1.0"
description = "Zalo AI Challenge 2026 Track 1 (LifeMate): voice-to-tool-calling agent reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LifeMate team" }]
# Stdlib only. Every heavy dependency is an extra and imported lazily.
dependencies = []

[project.scripts]
lifemate = "lifemate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
# Floors are the versions VERIFIED on the training box (torch 2.15.0+cu132,
# transformers 5.22.2, peft 0.21.2, accelerate 1.15.0). MiniCPM5-2B's config.json
# declares transformers_version 5.6.2 and Qwen3.5-4B needs the `qwen3_5` classes,
# neither of which exists at 4.44 — the old floor could not load either model.
train = [
    "torch>=2.15",
    "transformers>=5.22",
    "peft>=0.21",
    "accelerate>=0.33",
    "datasets>=2.20",
    "wandb>=0.17",
]
qlora = [
    "bitsandbytes>=0.43",
    "peft>=0.21",
    "torch>=2.15",
    "transformers>=5.22",
]
asr = [
    "numpy>=1.20",
    "soundfile>=0.12",
    "sherpa-onnx>=1.10",
    "sherpa-onnx-core>=1.10",
    "huggingface-hub>=0.20",
]
onnx = [
    "sherpa-onnx>=1.10",
    "sherpa-onnx-core>=1.10",
    "soundfile>=0.12",
    "numpy>=1.20",
]
asr-whisper = [
    "torch>=2.15",
    "transformers>=5.22",
    "soundfile>=0.12",
]
cloud = [
    "wandb>=0.17",
]
eda = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]
audio = ["soundfile>=0.12"]
plot = ["matplotlib>=3.8"]
# --- optional feature groups (src/lifemate/features/registry.py) ------------- #
# VERIFIED: none of the 12 feature flags needs a package that the extras above
# (or `dependencies = []`) do not already provide, so this block adds NO group.
# `pip install -e .` therefore installs the baseline and not one optional package,
# and enabling a flag never implies an install. Per flag:
#
#   audio.vad                  -> no package. src/lifemate/asr/audio_ops.py is a
#       pure-python energy VAD (math + dataclasses) and no module imports silero or
#       webrtcvad. The registry's `requires` names them as ARTIFACTS; a silero-vad
#       pip group would also fetch its weights from the hub on first use, which is
#       impossible under the image's `--network none`.
#   audio.rms_normalization    -> no package (same module).
#   asr.nbest                  -> `asr`/`onnx` (sherpa-onnx).
#   asr.gipformer_v15          -> no package; needs the 1.5 checkpoint files on disk.
#   asr.multi_asr              -> no package. src/lifemate/asr/multi_backend.py
#       imports only stdlib + .interface/.nbest; a secondary backend brings its own
#       deps (whisper -> `asr-whisper`).
#   prompt.itn                 -> no package (src/lifemate/asr/normalization.py: re).
#   prompt.nbest_format        -> no package.
#   training.noisy_asr         -> no package. data/asr_variants.py + augmentation.py
#       import only stdlib + lifemate.*.
#   training.slot_masking      -> no package (same modules).
#   training.tool_dropout      -> no package (same modules).
#   decoding.constrained       -> `train` (torch + transformers). The implementation
#       is a plain transformers.LogitsProcessor over a Python prefix trie
#       (models/constrained.py); outlines/llguidance/xgrammar are NOT used.
#   postprocessing.enhanced_schema_guardrail
#                              -> no package (agent/guardrail.py: re + dataclasses).

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
